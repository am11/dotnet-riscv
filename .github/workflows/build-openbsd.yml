name: Build .NET SDK for openbsd-x64

on:
  workflow_dispatch:
    inputs:
      fork:
        description: 'dotnet VMR fork name'
        required: true
        type: string
        default: dotnet
      branch:
        description: 'dotnet VMR branch name'
        required: true
        type: string
        default: main
      is_rtm:
        description: 'is RTM build'
        type: boolean
        default: false
      release:
        description: 'publish release'
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: openbsd
            version: 7.8
            docker_tag: azurelinux-3.0-net11.0-cross-openbsd-7.8-amd64
          - name: openbsd
            version: 7.9
            docker_tag: azurelinux-3.0-net11.0-cross-openbsd-7.9-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1
      with:
        android: true
        dotnet: true
        large-packages: false
        swap-storage: true
        tools-cache: true

    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    - name: Build
      run: |
        docker run --platform linux/amd64 --rm -v${{ github.workspace }}/dotnet:/dotnet -w /dotnet -e ROOTFS_DIR=/crossrootfs/x64 \
          mcr.microsoft.com/dotnet-buildtools/prereqs:${{ matrix.docker_tag }} \
            ./build.sh --clean-while-building --prep -sb --os ${{ matrix.name }} --rid ${{ matrix.name }}-x64 \
              --arch x64 ${{ inputs.is_rtm && '--branding rtm' || '' }} -p:OfficialBuildId=$(date +%Y%m%d).99

    - name: List assets directory
      run: |
        find "${{ github.workspace }}/dotnet/artifacts"

    - name: Upload .NET
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-sdk-${{ matrix.name }}-${{ matrix.version }}
        path: |
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*.tar.gz
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Private.SourceBuilt.Artifacts.*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ inputs.release }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Make release
      run: |
        sudo apt install -y hub

        # hub(1) requires release to be created inside a git repo
        git clone https://${{ secrets.CLONE_TOKEN }}:x-oauth-basic@github.com/${{ github.repository }}.git repo
        cd repo
        
        # Find both SDKs and SourceBuilt artifact tarballs
        all_paths=$(find ${{ github.workspace }}/artifacts \( -name 'dotnet-sdk-*.tar.gz' -o -name 'Private.SourceBuilt.Artifacts.*.tar.gz' \))
        artifacts=""
        
        for file_path in $all_paths; do
          filename=$(basename "$file_path")
          suffix_string=$(echo "$file_path" | grep -oE 'openbsd-[0-9]+\.[0-9]+')
          
          # Handle renaming logic to insert the OpenBSD version injection
          if [[ "$filename" == dotnet-sdk-* ]]; then
            unique_filename=$(echo "$filename" | sed "s/-openbsd-x64/-${suffix_string}-x64/")
            sdk_version=$(echo "$unique_filename" | sed -E "s/dotnet-sdk-([^-]+(-[^-]+)*)-${suffix_string}-.+\.tar\.gz/\1/")
            tag_name="$sdk_version"
          elif [[ "$filename" == Private.SourceBuilt.Artifacts.* ]]; then
            unique_filename=$(echo "$filename" | sed "s/.openbsd-x64/.${suffix_string}-x64/")
          fi

          unique_path="$(dirname "$file_path")/$unique_filename"
          mv "$file_path" "$unique_path"
          artifacts="$artifacts -a $unique_path"
        done

        echo "tag_name: $tag_name"
        echo "artifacts: $artifacts"

        # docs: https://hub.github.com/hub-release.1.html
        hub release create $artifacts --prerelease -m "$tag_name" "$tag_name"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
